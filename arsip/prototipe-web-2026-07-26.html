<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Teman Lupus</title>
    <meta name="theme-color" content="#7c3aed" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Teman Lupus" />
    <style>
      :root {
        --ungu: #7c3aed;
        --ungu2: #b04ec0;
        --abu: #6b7280;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        background: #f3effb;
        color: #1f2937;
      }
      .app {
        max-width: 460px;
        margin: 0 auto;
        min-height: 100vh;
        background: #fff;
        display: flex;
        flex-direction: column;
      }
      .hdr {
        background: linear-gradient(90deg, var(--ungu), var(--ungu2));
        color: #fff;
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .hdr h1 {
        font-size: 17px;
        margin: 0;
      }
      .hdr button {
        background: rgba(255, 255, 255, 0.2);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
      }
      .body {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }
      .view {
        display: none;
      }
      .view.active {
        display: block;
      }
      .nav {
        display: flex;
        border-top: 1px solid #eee;
      }
      .nav button {
        flex: 1;
        border: none;
        background: none;
        padding: 9px 2px 11px;
        font-size: 10.5px;
        color: #9ca3af;
      }
      .nav button.on {
        color: var(--ungu);
        font-weight: 700;
      }
      .nav button .ic {
        display: block;
        font-size: 18px;
        margin-bottom: 2px;
      }
      .lbl {
        font-size: 14px;
        font-weight: 600;
        margin: 16px 0 8px;
        color: #374151;
      }
      .lbl:first-child {
        margin-top: 2px;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 11px;
        border: 1px solid #d1d5db;
        border-radius: 10px;
        font-size: 14px;
        font-family: inherit;
        margin-bottom: 6px;
      }
      .btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-size: 15px;
        font-weight: 700;
        margin-top: 10px;
      }
      .btn.p {
        background: var(--ungu);
        color: #fff;
      }
      .btn.g {
        background: #ede9fe;
        color: #5b21b6;
      }
      .btn.green {
        background: #16a34a;
        color: #fff;
      }
      .dose {
        border: 1px solid #d1d5db;
        background: #f9fafb;
        color: #374151;
        border-radius: 9px;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 600;
      }
      .dose.on {
        background: #16a34a;
        border-color: #16a34a;
        color: #fff;
      }
      .seg {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .seg button {
        border: 1px solid #e5e7eb;
        background: #f9fafb;
        color: #4b5563;
        padding: 9px 13px;
        border-radius: 10px;
        font-size: 13px;
      }
      .seg button.on {
        background: var(--ungu);
        color: #fff;
        border-color: var(--ungu);
      }
      .chip {
        border: 1px solid #e5e7eb;
        background: #f3f4f6;
        color: #6b7280;
        padding: 8px 13px;
        border-radius: 18px;
        font-size: 13px;
        display: inline-block;
        margin: 0 6px 8px 0;
      }
      .chip.on {
        background: #fbeef6;
        border-color: #e9b8d6;
        color: #9d2c6f;
        font-weight: 600;
      }
      .moods button {
        font-size: 26px;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 2px solid transparent;
        background: #f4f1fb;
      }
      .moods button.on {
        border-color: var(--ungu);
        background: #ede4fb;
      }
      .card {
        border: 1px solid #eee;
        border-radius: 12px;
        padding: 13px;
        margin-bottom: 10px;
      }
      .result {
        border-radius: 14px;
        padding: 18px;
        text-align: center;
        margin-top: 8px;
      }
      .pill {
        display: inline-block;
        padding: 2px 9px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
      }
      .msg {
        font-size: 13px;
        padding: 10px;
        border-radius: 8px;
        margin: 8px 0;
        display: none;
      }
      .msg.err {
        background: #fef2f2;
        color: #b91c1c;
        display: block;
      }
      .msg.ok {
        background: #f0fdf4;
        color: #15803d;
        display: block;
      }
      small.muted {
        color: var(--abu);
        font-size: 12px;
      }
      .q {
        font-size: 13.5px;
        font-weight: 600;
        margin: 12px 0 5px;
      }
      .center {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .logo {
        text-align: center;
        font-size: 30px;
        font-weight: 800;
        color: var(--ungu);
      }
      .code {
        background: #f5f3ff;
        border: 1px dashed #c4b5fd;
        border-radius: 8px;
        padding: 8px;
        font-size: 11px;
        word-break: break-all;
        color: #5b21b6;
      }
      .disc {
        font-size: 10px;
        color: #b8a9d6;
        text-align: center;
        margin-top: 10px;
      }
    </style>
  </head>

        if (perm === 'unsupported') return 'browser tak mendukung notifikasi';
        if (!r.enabled) return 'nonaktif';

      function reminderCardHtml() {
        const r = getRem();

  <div style="background:#faf5ff;border:1px solid #ede9fe;border-radius:12px;padding:12px 14px;margin-top:14px">

      function suggestMedTimes(freq) {
        const map = {
          1: ['08:00'],
          2: ['08:00', '20:00'],
          3: ['08:00', '14:00', '20:00'],
          4: ['06:00', '12:00', '18:00', '22:00'],
        };
        return map[Math.min(4, Math.max(1, freq || 1))];
      }
      function _medTimesFrom(aktif) {
        if (!aktif || !aktif.length) return [];
        const maxF = aktif.reduce((a, m) => Math.max(a, m.freq_per_hari || 1), 1);
        return suggestMedTimes(maxF);
      }
      function applyRemMedTimes(aktif) {
        const r = getRem();
        r.meds = _medTimesFrom(aktif);
        setRem(r);

      async function toggleRemEnable(cb) {
        if (cb.checked) {

            alert('Browser ini tidak mendukung notifikasi.');
            cb.checked = false;
            return;
          }
          let p = Notification.permission;
          if (p !== 'granted') p = await Notification.requestPermission();
          if (p !== 'granted')
            alert(
              'Izin notifikasi belum diberikan. Pengingat baru muncul setelah izin diaktifkan di pengaturan browser.'
            );
        }
        const r = getRem();
        r.enabled = cb.checked;
        setRem(r);
        startReminderScheduler();

        if (s) s.textContent = remStatusText(r);

      let _remTimer = null;
      function _firedGet() {
        try {
          return JSON.parse(localStorage.getItem('tl_rem_fired') || '{}');
        } catch (e) {
          return {};
        }
      }
      function _firedSet(o) {
        try {
          localStorage.setItem('tl_rem_fired', JSON.stringify(o));
        } catch (e) {}
      }
      function _remTick() {
        const r = getRem();
        if (!r.enabled) return;
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        const now = new Date();
        const cur = now.getHours() * 60 + now.getMinutes();
        const dateKey = now.toISOString().slice(0, 10);
        const fired = _firedGet();
        if (fired.d !== dateKey) {
          fired.d = dateKey;
          fired.keys = {};
        }
        const items = [
          ['Check-in Teman Lupus', r.checkin, 'Yuk isi check-in harianmu 🌸', 'ci'],
        ].concat(
          (r.meds || []).map((m, i) => [
            'Waktunya minum obat',
            m,
            'Jangan lupa minum obat lalu centang di aplikasi 💊',
            'med' + i,
          ])
        );
        let changed = false;
        items.forEach((it) => {
          const [title, t, body, id] = it;
          if (!t) return;
          const p = t.split(':');
          const sched = +p[0] * 60 + +p[1];
          if (cur < sched) return;
          const key = id + '|' + t;
          if (fired.keys[key]) return;
          fired.keys[key] = 1;
          changed = true;
          try {
            new Notification(title, { body, icon: LOGO, tag: 'tl-' + id });
          } catch (e) {}
        });
        if (changed) _firedSet(fired);
      }
      function startReminderScheduler() {
        if (_remTimer) clearInterval(_remTimer);

      async function toggleDose(id, slot, btn) {
        const set = medTaken[id] || (medTaken[id] = new Set());
        const was = set.has(slot),
          today = todayStr();

        if (was) set.delete(slot);

        btn.classList.toggle('on', !was);
        btn.innerHTML = (!was ? '✅' : '⬜') + ' ' + btn.dataset.lbl;

          if (was) {
            const { error } = await sb
              .from('med_logs')
              .delete()
              .eq('medication_id', id)
              .eq('tanggal', today)
              .eq('slot', slot);
            if (error) throw error;
          } else {
            const { error } = await sb.from('med_logs').upsert(
              {
                patient_id: STATE.patientId,
                medication_id: id,
                tanggal: today,
                slot,
                diminum: true,
              },
              { onConflict: 'medication_id,tanggal,slot' }
            );

          const card = btn.closest('.card'),
            pill = card && card.querySelector('.pill');

            const freq = card.querySelectorAll('.dose').length,
              done = set.size,
              hab = done >= freq;

            pill.style.background = hab ? '#16a34a' : done > 0 ? '#f59e0b' : '#9ca3af';
          }

          // gagal → kembalikan

      // Mini grafik garis (SVG, tanpa library)
      function svgLine(vals, color, ymin, ymax, label, suffix) {
        if (!vals.length)
          return `<div class="card"><small class="muted">${label}: belum ada data</small></div>`;
        const w = 320,
          h = 92,
          pad = 8,
          n = vals.length;
        const xs = (i) => pad + (w - 2 * pad) * (n === 1 ? 0.5 : i / (n - 1));
        const ys = (v) => h - pad - (h - 2 * pad) * ((v - ymin) / (ymax - ymin || 1));
        const pts = vals.map((v, i) => xs(i).toFixed(1) + ',' + ys(v).toFixed(1)).join(' ');
        const dots = vals
          .map(
            (v, i) =>
              `<circle cx="${xs(i).toFixed(1)}" cy="${ys(v).toFixed(1)}" r="3.2" fill="${color}"/>`
          )
          .join('');
        return `<div class="card"><div style="font-size:13px;font-weight:600;color:#374151;margin-bottom:6px">${label}
    <span style="float:right;color:${color}">terakhir: ${vals[n - 1]}${suffix || ''}</span></div>
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="92" preserveAspectRatio="none">
      <polyline fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${pts}"/>${dots}
    </svg></div>`;
      }

      function csvCell(v) {
        if (v == null) return '';
        if (Array.isArray(v)) v = v.join('; ');
        else if (typeof v === 'object') v = JSON.stringify(v);
        v = String(v);
        return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;

      function toCSV(rows) {
        if (!rows.length) return '';
        const cols = Object.keys(rows[0]);

          .join('\r\n');
      }
      function dlFile(name, text) {
        const blob = new Blob(['﻿' + text], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
      }

          patient_id: pid,
          doctor_id: STATE.user.id,
          deskriptor: desk,
          total,
          kategori: sledaiKat(total),
        });
        if (error) {
          m.className = 'msg err';
          m.textContent = 'Gagal: ' + error.message;
          return;
        }
        m.className = 'msg ok';
        m.textContent = '✅ SLEDAI tersimpan';
        docPatient(pid);
      }

      // ---------- DOCTOR APP ----------
      async function doctorApp() {
        shell('Dashboard Dokter', '<div id="dwrap">Memuat...</div>', '');
        const { data: pts } = await sb
          .from('patients')
          .select('id, profile_id, profiles!patients_profile_id_fkey(nama)')
          .eq('doctor_id', STATE.user.id);
        const { data: alerts } = await sb
          .from('alerts')
          .select('*')
          .eq('selesai', false)
          .order('created_at', { ascending: false });
        let cards = '';
        window.DOCPTS = {};
        for (const p of pts || []) {
          const nm = (p.profiles && p.profiles.nama) || 'Pasien';
          window.DOCPTS[p.id] = nm;
          const { data: lastCi } = await sb
            .from('daily_checkins')
            .select('tanggal,mood,nyeri_sendi')
            .eq('patient_id', p.id)
            .order('created_at', { ascending: false })
            .limit(1)
            .maybeSingle();
          const { data: lastMa } = await sb
            .from('mars_assessments')
            .select('total,kategori')
            .eq('patient_id', p.id)
            .order('created_at', { ascending: false })
            .limit(1)
            .maybeSingle();
          const { data: lastFl } = await sb
            .from('flare_checks')
            .select('hasil,waktu')
            .eq('patient_id', p.id)
            .order('waktu', { ascending: false })
            .limit(1)
            .maybeSingle();
          const flcol =
            { red: '#dc2626', yellow: '#d97706', green: '#16a34a' }[lastFl && lastFl.hasil] ||
            '#9ca3af';
          cards += `<div class="card" style="cursor:pointer" onclick="docPatient('${p.id}')"><b>${nm}</b> <span style="float:right;color:#7c3aed;font-size:12px">lihat detail →</span>
      <div style="font-size:12px;color:#6b7280;margin-top:4px">
      Check-in: ${lastCi ? lastCi.tanggal + ' (mood ' + lastCi.mood + ', nyeri ' + lastCi.nyeri_sendi + ')' : '—'}<br>
      MARS-5: ${lastMa ? lastMa.total + '/25 (' + lastMa.kategori + ')' : '—'}<br>
      Cek Flare: <span class="pill" style="background:${flcol}">${lastFl ? lastFl.hasil : '—'}</span></div></div>`;
        }
        const aList = (alerts || [])
          .map(
            (a) =>
              `<div class="card" style="background:#fef2f2;border-color:#fecaca;color:#b91c1c">🔴 ${a.pesan} <button class="btn g" style="margin-top:6px;padding:7px" onclick="resolveAlert('${a.id}')">Tandai selesai</button></div>`
          )
          .join('');
        $('dwrap').innerHTML = `<div class="hdr2"></div>
    <div class="lbl">Kode dokter Anda (bagikan ke pasien)</div><div class="code">${STATE.user.id}</div>
    ${aList ? '<div class="lbl">Peringatan</div>' + aList : ''}
    <div class="lbl">Pasien saya (${(pts || []).length})</div>${cards || '<small class="muted">Belum ada pasien terhubung. Bagikan kode di atas ke pasien.</small>'}
    <button class="btn g" onclick="doctorApp()">🔄 Segarkan</button>
    <p style="text-align:center;margin-top:14px"><button onclick="logout()" style="border:none;background:none;color:#9ca3af">Keluar</button></p>`;
      }
      async function resolveAlert(id) {
        await sb.from('alerts').update({ selesai: true }).eq('id', id);
        doctorApp();
      }

      async function docPatient(pid) {
        const nm = (window.DOCPTS && window.DOCPTS[pid]) || 'Pasien';
        shell('Detail Pasien', '<div id="pdwrap">Memuat...</div>', '');
        const today = new Date().toISOString().slice(0, 10);
        const [pt, meds, logs, ci, ma, fl, lab, sledai] = await Promise.all([
          sb
            .from('patients')
            .select('tgl_diagnosis,klasifikasi,organ_terlibat')
            .eq('id', pid)
            .maybeSingle(),
          sb.from('medications').select('*').eq('patient_id', pid).order('created_at'),
          sb
            .from('med_logs')
            .select('medication_id,slot,diminum,tanggal')
            .eq('patient_id', pid)
            .eq('tanggal', today),
          sb
            .from('daily_checkins')
            .select('*')
            .eq('patient_id', pid)
            .order('created_at', { ascending: false })
            .limit(7),
          sb
            .from('mars_assessments')
            .select('*')
            .eq('patient_id', pid)
            .order('created_at', { ascending: false })
            .limit(3),
          sb
            .from('flare_checks')
            .select('*')
            .eq('patient_id', pid)
            .order('waktu', { ascending: false })
            .limit(5),
          sb
            .from('lab_results')
            .select('*')
            .eq('patient_id', pid)
            .order('tanggal', { ascending: false })
            .limit(20),
          sb
            .from('sledai_assessments')
            .select('*')
            .eq('patient_id', pid)
            .order('tanggal', { ascending: false })
            .limit(30),
        ]);
        const doseCount = {};
        (logs.data || []).forEach((l) => {
          doseCount[l.medication_id] = (doseCount[l.medication_id] || 0) + 1;
        });
        const medList =
          (meds.data || [])
            .map((m) => {
              const freq = m.freq_per_hari || 1,
                taken = doseCount[m.id] || 0,
                hab = taken >= freq;
              return `<div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div><b>${m.nama_obat}</b><br><small class="muted">${m.dosis || ''} ${m.jadwal || ''} · ${freq}×/hari${m.aktif === false ? ' · (nonaktif)' : ''}</small></div>
      <span class="pill" style="background:${hab ? '#16a34a' : taken > 0 ? '#f59e0b' : '#9ca3af'}">${taken}/${freq} dosis</span></div>`;
            })
            .join('') || '<small class="muted">Belum ada obat dicatat pasien.</small>';
        const p = pt.data || {};
        const organOpts = ['Kulit', 'Sendi', 'Ginjal', 'Hematologi', 'Saraf', 'Serositis'];
        const orgSet = new Set(p.organ_terlibat || []);
        const klinis = `<div class="card">
    <b>📝 Data klinis (diisi dokter)</b>
    <div class="lbl" style="margin-top:8px">Tanggal diagnosis</div>
    <input id="k_tgl" type="date" value="${p.tgl_diagnosis || ''}">
    <div class="lbl">Klasifikasi / catatan</div>
    <input id="k_klas" placeholder="mis. Nefritis lupus kelas III" value="${(p.klasifikasi || '').replace(/"/g, '&quot;')}">
    <div class="lbl">Organ terlibat</div>
    <div id="k_organ">${organOpts.map((o) => `<span class="chip ${orgSet.has(o) ? 'on' : ''}" onclick="this.classList.toggle('on')">${o}</span>`).join('')}</div>
    <button class="btn p" onclick="saveKlinis('${pid}')">💾 Simpan data klinis</button>
    <div id="k_msg" class="msg"></div></div>`;
        const ciList =
          (ci.data || [])
            .map(
              (c) =>
                `<div class="card" style="font-size:13px"><small class="muted">${c.tanggal}</small><br>Mood ${c.mood}/5 · Lelah ${c.lelah} · Nyeri ${c.nyeri_sendi}${c.gejala && c.gejala.length ? ' · ' + c.gejala.join(', ') : ''}</div>`
            )
            .join('') || '<small class="muted">—</small>';
        const maList =
          (ma.data || [])
            .map(
              (m) =>
                `<div class="card" style="font-size:13px">MARS-5: <b>${m.total}/25</b> (${m.kategori}) <small class="muted">${m.tanggal}</small></div>`
            )
            .join('') || '<small class="muted">—</small>';
        const flcolm = { red: '#dc2626', yellow: '#d97706', green: '#16a34a' };
        const flList =
          (fl.data || [])
            .map(
              (f) =>
                `<div class="card" style="font-size:13px">Cek Flare: <span class="pill" style="background:${flcolm[f.hasil] || '#9ca3af'}">${f.hasil}</span> <small class="muted">${(f.waktu || '').slice(0, 10)}</small></div>`
            )
            .join('') || '<small class="muted">—</small>';
        const labList =
          (lab.data || [])
            .map((r) => {
              const ab = labAbnormal(r.jenis, r.nilai_num);
              const val =
                r.nilai_num != null
                  ? `<b style="color:${ab ? '#dc2626' : '#111827'}">${r.nilai_num}</b> ${r.satuan || ''}`
                  : r.nilai_teks || '-';
              return `<div class="card" style="font-size:13px"><small class="muted">${r.tanggal}</small> · ${r.jenis}: ${val}</div>`;
            })
            .join('') || '<small class="muted">—</small>';
        const labByJ = {};
        (lab.data || [])
          .slice()
          .reverse()
          .forEach((r) => {
            if (r.nilai_num != null) {
              (labByJ[r.jenis] = labByJ[r.jenis] || []).push(r.nilai_num);
            }
          });
        let labTrend = '';
        Object.keys(labByJ).forEach((j) => {
          const vs = labByJ[j];
          if (vs.length >= 2) {
            const mn = Math.min(...vs),
              mx = Math.max(...vs),
              pad = (mx - mn) * 0.15 || 1;
            labTrend += svgLine(
              vs,
              '#0d9488',
              mn - pad,
              mx + pad,
              j,
              labRef(j) ? ' ' + labRef(j).u : ''
            );
          }
        });
        const sledaiList =
          (sledai.data || [])
            .map(
              (s) =>
                `<div class="card" style="font-size:13px">SLEDAI-2K: <b>${s.total}</b> <span class="pill" style="background:${s.total === 0 ? '#16a34a' : s.total <= 5 ? '#65a30d' : s.total <= 10 ? '#d97706' : s.total <= 19 ? '#dc2626' : '#7f1d1d'}">${s.kategori}</span> <small class="muted">${s.tanggal}</small>${Array.isArray(s.deskriptor) && s.deskriptor.length ? '<br><span class="muted" style="font-size:11px">' + s.deskriptor.join(', ') + '</span>' : ''}</div>`
            )
            .join('') || '<small class="muted">Belum ada penilaian SLEDAI.</small>';
        const sVals = (sledai.data || [])
          .slice()
          .reverse()
          .map((s) => s.total);
        let sledaiTrend = '';
        if (sVals.length >= 2) {
          const mx = Math.max(...sVals, 1);
          sledaiTrend = svgLine(sVals, '#7c3aed', 0, mx * 1.15 || 1, 'Skor SLEDAI-2K', '');
        }
        $('pdwrap').innerHTML = `
    <button class="btn g" onclick="doctorApp()">← Kembali ke daftar</button>
    <div class="lbl" style="font-size:18px">${nm}</div>
    ${klinis}
    ${sledaiFormHtml(pid)}
    ${sledaiTrend ? '<div class="lbl">📉 Tren SLEDAI</div>' + sledaiTrend : ''}
    <div class="lbl">🧮 Riwayat SLEDAI</div>${sledaiList}
    <div class="lbl">💊 Daftar obat (status hari ini)</div>${medList}
    <div class="lbl">📈 Check-in terakhir</div>${ciList}
    <div class="lbl">📋 MARS-5 terakhir</div>${maList}
    <div class="lbl">🩺 Cek Flare terakhir</div>${flList}
    <div class="lbl">🧪 Hasil lab</div>${labList}
    ${labTrend ? '<div class="lbl">📈 Tren lab</div>' + labTrend : ''}
    ${
      canExport()
        ? `
    <div class="lbl">⬇️ Ekspor data (CSV untuk analisis)</div>
    <div class="seg" style="flex-wrap:wrap">
      <button onclick="exportCSV('${pid}','checkin')">Check-in</button>
      <button onclick="exportCSV('${pid}','obat')">Kepatuhan obat</button>
      <button onclick="exportCSV('${pid}','mars')">MARS-5</button>
      <button onclick="exportCSV('${pid}','flare')">Flare</button>
      <button onclick="exportCSV('${pid}','lab')">Lab</button>
    </div>
    <small class="muted">File CSV siap dibuka di Excel/SPSS/R.</small>`
        : ''
    }
    <button class="btn g" onclick="doctorApp()" style="margin-top:14px">← Kembali</button>`;
      }
      async function saveKlinis(pid) {
        const organ = [...document.querySelectorAll('#k_organ .chip.on')].map((x) =>
          x.textContent.trim()
        );
        const m = document.getElementById('k_msg');
        const { error } = await sb
          .from('patients')
          .update({
            tgl_diagnosis: document.getElementById('k_tgl').value || null,
            klasifikasi: document.getElementById('k_klas').value || null,
            organ_terlibat: organ,
          })
          .eq('id', pid);
        if (error) {
          m.className = 'msg err';
          m.textContent = 'Gagal: ' + error.message;
          return;
        }
        m.className = 'msg ok';
        m.textContent = '✅ Data klinis tersimpan';
      }

      boot();
    </script>
  </body>
</html>
